[package]
name = "obpterm-host"
version = "0.21.20"
description = "OBPTerm's session host: owns the shells so the window can close, update and come back"
edition = "2021"

# The library is the protocol + registry (the app links it for the client side); the binary
# is the headless process that outlives the window.
[[bin]]
name = "obpterm-host"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
rand = "0.8"
