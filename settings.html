<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBPTerm Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body class="settings-window">
    <header id="sw-head" data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>Settings</span>
      <span class="crumb" data-tauri-drag-region></span>
      <span class="path" data-tauri-drag-region></span>
      <span class="grow" data-tauri-drag-region></span>
      <span class="saved" hidden>Saved</span>
      <button class="win close" title="Close (Esc)" aria-label="Close">
        <svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.2"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg>
      </button>
    </header>
    <div id="sw-body">
      <nav id="sw-nav"></nav>
      <main id="sw-main"></main>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/settings-main.ts"></script>
  </body>
</html>
