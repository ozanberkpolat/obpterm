[package]
name = "obpterm"
version = "0.9.0"
description = "Vertical-tab terminal for Windows: pwsh / PowerShell / cmd over ConPTY"
edition = "2021"
rust-version = "1.77"

[lib]
name = "obpterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
obpterm-host = { path = "../host" }
tokio = { version = "1", features = ["sync", "time"] }
# The webview cannot download a release asset: GitHub redirects to objects.githubusercontent.com,
# which sends no CORS headers. So the update check and download live here instead.
# native-tls = schannel on Windows: no C toolchain, and the OS certificate store.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
# Pinned to what tauri 2.11 itself uses; mismatched versions = two incompatible ICoreWebView2 types.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

