name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build MSI + NSIS (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('winterm {0}', github.ref_name) || '' }}
          releaseBody: "Unsigned build: SmartScreen will show 'More info → Run anyway' once per download. The .exe (NSIS) installs per-user without admin; the .msi installs per-machine."
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: winterm-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
