<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBPTerm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <span class="brandmark" data-tauri-drag-region>
          <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 14 12 8 18"/></svg>
        </span>
        <span class="wordmark" data-tauri-drag-region>OBPTERM</span>
        <span class="rule" data-tauri-drag-region></span>
        <span class="menus"></span>
        <span class="grow" data-tauri-drag-region></span>
        <button class="search" title="Command palette (Ctrl+K)">Ctrl+K&nbsp;&nbsp;search</button>
        <button class="gear" title="Settings (Ctrl+Shift+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.1A1.7 1.7 0 0 0 10.13 3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.04a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
        </button>
        <span class="wingroup">
          <button class="win" data-action="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12" width="11" height="11" stroke="currentColor" stroke-width="1.2"><line x1="2" y1="6" x2="10" y2="6"/></svg></button>
          <button class="win" data-action="maximize" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
          <button class="win close" data-action="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.2"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg></button>
        </span>
      </header>
      <div id="workbench">
      <nav id="rail" aria-label="Tabs">
        <div id="rail-head">
          <span class="brand">Sessions</span>
          <span id="rail-waiting" hidden></span>
          <button id="rail-toggle" title="Toggle rail (Ctrl+Shift+B)">‹</button>
        </div>
        <button id="rail-agents" hidden title="Agents (Ctrl+G)">
          <span class="spark"></span>
          <span class="alabel"><span class="atitle">Agents</span><span class="asub"></span></span>
          <span class="awork"></span>
          <span class="abadge" hidden></span>
        </button>
        <div id="rail-body"></div>
        <div id="rail-new" hidden></div>
        <div id="rail-resize" title="Drag to resize the rail"></div>
        <div id="rail-foot">
          <button id="new-tab" title="New tab (Ctrl+Shift+T). Right-click: pick a profile">+ Tab</button>
          <button id="new-project" title="Group tabs into a project">+ Project</button>
        </div>
      </nav>
      <main id="panes">
        <div id="toolbar" role="toolbar" aria-label="Pane actions"></div>
        <div id="find" hidden>
          <input type="text" placeholder="Find in scrollback" aria-label="Find in scrollback" spellcheck="false" />
          <span class="count"></span>
          <button class="case" title="Match case">Aa</button>
          <button class="regex" title="Regular expression">.*</button>
          <button class="prev" title="Previous (Shift+Enter)">↑</button>
          <button class="next" title="Next (Enter)">↓</button>
          <button class="close" title="Close (Esc)">×</button>
        </div>
      </main>
      </div>
      <footer id="status">
        <button id="account-chip" class="chip" title="Account for new shells (click to switch)">
          <span class="dot"></span><span class="who">—</span>
        </button>
        <button id="quota" class="chip meters" title="Tokens this machine has sent, from Claude Code's own transcripts">
          <span class="meter" data-window="5h"><span class="bar"><i></i></span><span class="val">—</span></span>
          <span class="meter" data-window="7d"><span class="bar"><i></i></span><span class="val">—</span></span>
        </button>
        <span class="spacer"></span>
        <span id="ctx-chip" class="chip meters" hidden><span class="meter"><span class="k">ctx</span><span class="bar"><i></i></span><span class="v"></span></span></span>
        <span id="metrics" class="metrics" title="This machine"></span>
        <span id="awake" class="chip" hidden title="An agent is working, so the machine is being held out of sleep. Turn off in Settings if unwanted.">☕ awake</span>
        <button id="host-chip" class="chip" hidden title="Shells the session host is holding"></button>
        <button id="update-chip" class="chip" title="Check GitHub for a newer release">Check for updates</button>
        <button id="target-chip" class="chip" title="Where this pane runs (click for the host book)"><span class="where">—</span></button>
        <span id="cwd" class="cwd"></span>
        <span id="capture" class="chip rec" hidden>● capturing</span>
        <span id="panecount" class="chip"></span>
      </footer>
      <div id="menu" hidden></div>
      <div id="settings" hidden>
        <div class="sheet">
          <header>
            <span class="title">Settings</span>
            <span class="crumb"></span>
            <span class="path"></span>
            <span class="grow"></span>
            <span class="saved" hidden>Saved</span>
            <button class="close" title="Close (Esc)" aria-label="Close">×</button>
          </header>
          <div class="sw-body">
            <nav class="sw-nav"></nav>
            <main class="sw-main"></main>
          </div>
        </div>
      </div>
      <div id="deck" hidden>
        <div class="dbox">
          <header class="dhead">
            <span class="dtitle">Agents</span>
            <span class="dsummary"></span>
            <span class="grow"></span>
            <label class="dfilter">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
              <input type="text" placeholder="Filter sessions" spellcheck="false" aria-label="Filter sessions" />
              <span class="dcountall"></span>
            </label>
            <button class="dclose" title="Close (Esc)" aria-label="Close">×</button>
          </header>
          <div class="dgrid"></div>
          <div class="dempty" hidden>No Claude sessions running. Open a tab with a claude profile and its state shows up here.</div>
        </div>
      </div>
      <div id="palette" hidden>
        <div class="pbox">
          <div class="pfield">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
            <input type="text" placeholder="Type a shell, a host, a project or a command" spellcheck="false" aria-label="Command palette" />
          </div>
          <div class="results"></div>
        </div>
      </div>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
