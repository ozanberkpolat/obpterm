<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>winterm</title>
    <link rel="stylesheet" href="/src/style.css" />

    <div id="app">
      <nav id="rail" aria-label="Tabs">

      <div id="profile-menu" hidden></div>
      <div id="toast" hidden></div>
